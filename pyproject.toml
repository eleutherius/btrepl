[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "btrepl-dev"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.60",
    "protobuf>=5.0",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[tool.setuptools.packages.find]
where = ["src/pybtrepl"]
include = ["btrepl*"]

[tool.pytest.ini_options]
testpaths = ["tests/integration"]
