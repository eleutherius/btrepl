name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: write       # start pages.yml after the release
  id-token: write      # build provenance attestations
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v7
      with:
        go-version-file: src/btrepl/go.mod

    - name: Build binaries, .deb and .rpm packages
      run: make packages

    - name: Collect release assets
      run: |
        mkdir -p dist
        cp build/bin/btrepl_linux_* build/*.deb build/*.rpm dist/
        cp src/btrepl/deploy/btrepl.service install.sh dist/
        cd dist && sha256sum btrepl_linux_* *.deb *.rpm btrepl.service install.sh > SHA256SUMS

    - name: Attest build provenance
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: |
          dist/btrepl_linux_*
          dist/*.deb
          dist/*.rpm
          dist/btrepl.service
          dist/install.sh

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes

    # Events from GITHUB_TOKEN do not start other workflows, except
    # workflow_dispatch. Run on main: the github-pages environment only
    # accepts deployments from the default branch, not from tags.
    - name: Publish install.sh and the APT repository to the site
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
