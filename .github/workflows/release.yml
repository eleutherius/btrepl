name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v5
      with:
        go-version-file: src/btrepl/go.mod

    - name: Build binaries, .deb and .rpm packages
      run: make packages

    - name: Collect release assets
      run: |
        mkdir -p dist
        cp build/bin/btrepl_linux_* build/*.deb build/*.rpm dist/
        cp src/btrepl/deploy/btrepl.service install.sh dist/
        cd dist && sha256sum btrepl_linux_* *.deb *.rpm > SHA256SUMS

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
